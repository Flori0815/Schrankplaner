<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schrankplaner PAX-Eigenbau</title>
<link rel="stylesheet" href="css/app.css?v=6">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Schrankplaner <small class="ver">v6</small> <span>Multiplex-Korpus · PAX-Raster · KOMPLEMENT-Innenleben</span></h1>
  <div class="hbtn">
    <button data-act="save">Speichern</button>
    <button data-act="load">Laden</button>
    <button data-act="reset" class="ghost">Zurücksetzen</button>
    <input type="file" id="loadFile" accept="application/json" hidden>
  </div>
</header>
<div id="app">
  <aside id="side"></aside>
  <main>
    <nav id="tabs">
      <button data-tab="front" class="on">Fronten</button>
      <button data-tab="top">Draufsicht</button>
      <button data-tab="3d">3D</button>
      <button data-tab="drill">Bohrplan</button>
      <button data-tab="lists">Listen</button>
    </nav>
    <div id="toolbar"></div>
    <div id="view"></div>
    <div id="view3d" hidden></div>
  </main>
  <aside id="insp"></aside>
</div>
<script type="module" src="js/app.js?v=6"></script>
</body>
</html>
